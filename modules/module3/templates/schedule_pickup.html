<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schedule Pickup - Waste2Value</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
    body { min-height: 100vh; background: #f4f7f5; }

    .navbar {
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }
    .navbar .logo { font-size: 20px; font-weight: 700; }
    .navbar a {
        background: rgba(255,255,255,0.2);
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
    }

    .content { max-width: 450px; margin: 50px auto; padding: 0 20px; }

    .form-card {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .form-card h2 { color: #2e7d32; margin-bottom: 20px; }

    .form-group { margin-bottom: 18px; }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
    }
</style>
</head>
<body>

<div class="navbar">
    <div class="logo">♻️ Waste2Value</div>
    <a href="/offers">← Back to Offers</a>
</div>

<div class="content">
    <div class="form-card">
        <h2>Schedule Pickup</h2>
        <form method="POST" action="/pickup/schedule/{{ offer_id }}">
            <div class="form-group">
                <label>Pickup Address</label>
                <input type="text" name="address" placeholder="Enter full address" required>
            </div>
            <div class="form-group">
                <label>Pickup Date</label>
                <input type="date" name="pickup_date" required>
            </div>
            <button type="submit">Confirm Pickup</button>
        </form>
    </div>
</div>

</body>
</html>
