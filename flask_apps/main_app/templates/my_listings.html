<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Listings - Waste2Value</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
    body { min-height: 100vh; background: #f4f7f5; }

    .navbar {
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }
    .navbar .logo { font-size: 20px; font-weight: 700; }
    .navbar-links { display: flex; gap: 10px; }
    .navbar a {
        background: rgba(255,255,255,0.2);
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
    }

    .content { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .content h2 { color: #2e7d32; margin-bottom: 20px; }

    .listing-row {
        background: white;
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
    }

    .listing-row .info h3 { font-size: 15px; color: #222; margin-bottom: 4px; }
    .listing-row .info .meta { font-size: 12px; color: #888; }
    .listing-row .price { font-size: 16px; font-weight: 700; color: #2e7d32; }

    .status-badge {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
        background: #e8f5e9;
        color: #2e7d32;
    }

    .row-actions { display: flex; gap: 8px; align-items: center; }

    .btn-view {
        padding: 7px 14px;
        background: #e8f5e9;
        color: #2e7d32;
        text-decoration: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
    }

    .btn-delete {
        padding: 7px 14px;
        background: #fdecea;
        color: #d32f2f;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }

    .error {
        background: #fdecea;
        color: #d32f2f;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 15px;
        text-align: center;
    }

    .empty-state { text-align: center; padding: 50px 20px; color: #999; }
    .empty-state .icon { font-size: 45px; margin-bottom: 15px; }
</style>

<!-- Waste2Value UI-only theme overrides: visual styles only; existing HTML, routes and behavior remain unchanged. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style id="waste2value-ui-only-theme">
:root {
  --w2v-cream: #faf6ef;
  --w2v-paper: #fffdf9;
  --w2v-ink: #2f2a24;
  --w2v-muted: #6b6258;
  --w2v-line: #e8dfd1;
  --w2v-sage: #8a9a7b;
  --w2v-sage-deep: #4f5d46;
  --w2v-sage-wash: #e7ebe0;
  --w2v-terra: #c8775a;
  --w2v-terra-deep: #a95d42;
  --w2v-shadow: 0 8px 24px rgba(47,42,36,.07);
}
html { scroll-behavior: smooth; }
body {
  background: var(--w2v-cream) !important;
  color: var(--w2v-ink) !important;
  font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
}
h1, h2, h3, h4, .logo, .brand, .hero-title {
  font-family: 'Fraunces', Georgia, serif !important;
}
.navbar, header.navbar {
  background: var(--w2v-paper) !important;
  color: var(--w2v-ink) !important;
  border-bottom: 1px solid var(--w2v-line) !important;
  box-shadow: 0 3px 16px rgba(47,42,36,.04) !important;
}
.navbar .logo, .navbar .user-info, .navbar .logo a {
  color: var(--w2v-ink) !important;
}
.navbar a {
  border-radius: 999px !important;
  transition: background .2s ease, transform .2s ease !important;
}
.navbar a:hover { transform: translateY(-1px); }
.content, main, .container, .page-container {
  color: var(--w2v-ink);
}
.welcome-card, .card, .listing-card, .form-card, .stat-card, .panel,
.order-card, .profile-card, .idea-card, .pickup-card {
  background: var(--w2v-paper) !important;
  border: 1px solid var(--w2v-line) !important;
  border-radius: 20px !important;
  box-shadow: var(--w2v-shadow) !important;
}
.welcome-card h2, .section-title, .page-title, .welcome-title {
  color: var(--w2v-sage-deep) !important;
}
p, .muted, .subtitle, .description { color: var(--w2v-muted); }
button, input[type="submit"], .btn, a.btn, .button, .primary-btn {
  border-radius: 999px !important;
  font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease !important;
}
button:hover, input[type="submit"]:hover, .btn:hover, a.btn:hover,
.button:hover, .primary-btn:hover {
  transform: translateY(-1px);
}
.btn-primary, .primary-btn, button[type="submit"], input[type="submit"] {
  background: var(--w2v-sage-deep) !important;
  border-color: var(--w2v-sage-deep) !important;
  color: white !important;
}
.btn-primary:hover, .primary-btn:hover, button[type="submit"]:hover,
input[type="submit"]:hover { background: #3e4a37 !important; }
.btn-secondary, .secondary-btn {
  background: var(--w2v-sage-wash) !important;
  border-color: var(--w2v-line) !important;
  color: var(--w2v-sage-deep) !important;
}
input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]),
select, textarea {
  border: 1px solid #d9cebd !important;
  border-radius: 12px !important;
  background: var(--w2v-paper) !important;
  color: var(--w2v-ink) !important;
  font: inherit;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid rgba(138,154,123,.35) !important;
  border-color: var(--w2v-sage) !important;
}
table {
  border-collapse: separate !important;
  border-spacing: 0 !important;
  overflow: hidden;
  border-radius: 14px;
  background: var(--w2v-paper);
}
th { background: var(--w2v-sage-wash) !important; color: var(--w2v-sage-deep) !important; }
th, td { border-color: var(--w2v-line) !important; }
.alert, .flash, .message {
  border-radius: 12px !important;
}
a { transition: color .18s ease; }
a:hover { color: var(--w2v-terra-deep); }
@media (max-width: 700px) {
  .navbar { flex-wrap: wrap; gap: 12px; padding: 14px 18px !important; }
  .content, main { padding-left: 16px !important; padding-right: 16px !important; }
  .welcome-card, .card, .listing-card, .form-card, .stat-card, .panel {
    border-radius: 16px !important;
  }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
</style>

</head>
<body>

<div class="navbar">
    <div class="logo">♻️ Waste2Value</div>
    <div class="navbar-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/listing/new">+ New Listing</a>
    </div>
</div>

<div class="content">
    <h2>My Listings</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if listings %}
        {% for item in listings %}
        <div class="listing-row">
            <div class="info">
                <h3>{{ item[2] }}</h3>
                <div class="meta">{{ item[3] }} · ₹{{ item[5] }}</div>
            </div>
            <span class="status-badge">{{ item[8] }}</span>
            <div class="row-actions">
                <a href="/listing/{{ item[0] }}" class="btn-view">View</a>
                <form method="POST" action="/listing/delete/{{ item[0] }}" onsubmit="return confirm('Delete this listing?');">
                    <button type="submit" class="btn-delete">Delete</button>
                </form>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="empty-state">
            <div class="icon">📦</div>
            <p>You haven't posted any listings yet.</p>
        </div>
    {% endif %}
</div>

</body>
</html>
