<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile - Waste2Value</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
    body { min-height: 100vh; background: #f4f7f5; }

    .navbar {
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }
    .navbar .logo { font-size: 20px; font-weight: 700; }
    .navbar a {
        background: rgba(255,255,255,0.2);
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
    }

    .content { max-width: 450px; margin: 40px auto; padding: 0 20px; }

    .form-card {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        margin: 0 auto 15px;
    }

    .form-card h2 { color: #2e7d32; text-align: center; margin-bottom: 5px; }
    .form-card .role-badge {
        display: block;
        text-align: center;
        color: #888;
        font-size: 13px;
        margin-bottom: 25px;
        text-transform: capitalize;
    }

    .form-group { margin-bottom: 18px; }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
    }

    .success-msg {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        margin-bottom: 15px;
    }

    .hint { font-size: 12px; color: #999; margin-top: 5px; }
</style>
</head>
<body>

<div class="navbar">
    <div class="logo">♻️ Waste2Value</div>
    <a href="/dashboard">← Back to Dashboard</a>
</div>

<div class="content">
    <div class="form-card">
        <div class="avatar">{{ user[1][0] | upper }}</div>
        <h2>{{ user[1] }}</h2>
        <span class="role-badge">{{ user[4] }}</span>

        {% if updated %}
            <div class="success-msg">✅ Profile updated successfully!</div>
        {% endif %}

        <form method="POST" action="/profile">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="{{ user[1] }}" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ user[2] }}" required>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="Leave blank to keep current password">
                <div class="hint">Only fill this in if you want to change your password</div>
            </div>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>

</body>
</html>
