<style>
    :root {
        --cream: #faf6ef;
        --cream-deep: #f3ece0;
        --paper: #fffdf9;
        --ink: #2f2a24;
        --ink-soft: #6b6258;
        --line: #e8dfd1;
        --sage: #8a9a7b;
        --sage-deep: #4f5d46;
        --sage-wash: #e7ebe0;
        --terracotta: #c8775a;
        --terracotta-deep: #a95d42;
        --terracotta-wash: #f6e4da;
        --danger: #a8402f;
        --radius: 20px;
        --shadow: 0 1px 2px rgba(47, 42, 36, .04), 0 8px 24px rgba(47, 42, 36, .06);
        --shadow-lift: 0 2px 4px rgba(47, 42, 36, .05), 0 18px 40px rgba(47, 42, 36, .10);
        --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
        --sans: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; border-radius: 6px; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* ---------- navbar ---------- */
    .nav { position: sticky; top: 0; z-index: 10; background: rgba(250, 246, 239, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 70px; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--sage-deep); display: grid; place-items: center; }
    .brand-name { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
    .brand-tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--terracotta-deep); margin-left: 2px; }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
    .nav-links a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink-soft); padding: 8px 14px; border-radius: 999px; transition: color .2s, background .2s; }
    .nav-links a:hover { color: var(--ink); background: var(--cream-deep); }
    .nav-links a { white-space: nowrap; }
    .nav-links a.pill { background: var(--ink); color: var(--paper); }
    .nav-links a.pill:hover { background: var(--sage-deep); }
    .nav-user { font-size: 13px; color: var(--ink-soft); padding: 0 6px; }

    /* ---------- hero ---------- */
    .hero { padding: 72px 0 56px; }
    .hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--sage-deep); background: var(--sage-wash); padding: 7px 14px; border-radius: 999px; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--terracotta); }
    .hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 5.2vw, 62px); line-height: 1.06; letter-spacing: -.02em; margin: 22px 0 20px; }
    .hero h1 em { font-style: italic; color: var(--terracotta-deep); }
    .hero p.lede { font-size: 17px; color: var(--ink-soft); max-width: 470px; margin-bottom: 32px; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--sans); font-size: 15px; font-weight: 600; text-decoration: none; padding: 14px 26px; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; transition: transform .2s, background .2s, color .2s, border-color .2s, box-shadow .2s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--terracotta); color: #fff; box-shadow: 0 6px 18px rgba(200, 119, 90, .28); }
    .btn-primary:hover { background: var(--terracotta-deep); }
    .btn-ghost { border-color: var(--ink); color: var(--ink); background: transparent; }
    .btn-ghost:hover { background: var(--ink); color: var(--paper); }
    .hero-notes { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 44px; padding-top: 26px; border-top: 1px solid var(--line); }
    .hero-notes div { font-size: 13px; color: var(--ink-soft); }
    .hero-notes strong { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); }
    .hero-art { position: relative; aspect-ratio: 1 / 1.02; }
    .hero-art svg { width: 100%; height: 100%; }
    .hero-badge { position: absolute; left: -18px; bottom: 34px; background: var(--paper); border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow-lift); display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-soft); }
    .hero-badge b { display: block; color: var(--ink); font-size: 14px; }
    .hero-badge span.dot { width: 38px; height: 38px; border-radius: 50%; background: var(--terracotta-wash); display: grid; place-items: center; font-size: 18px; }

    /* ---------- section heads ---------- */
    section { scroll-margin-top: 80px; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-bottom: 28px; }
    .kicker { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--terracotta-deep); margin-bottom: 8px; }
    .section-head h2, .sell-intro h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.1; letter-spacing: -.015em; }
    .count { font-size: 14px; color: var(--ink-soft); }

    /* ---------- notice ---------- */
    .notice { display: flex; align-items: center; gap: 12px; background: var(--sage-wash); color: var(--sage-deep); border: 1px solid #d4dccb; padding: 14px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; margin-bottom: 26px; }

    /* ---------- filters ---------- */
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 34px; list-style: none; }
    .filters a { display: inline-block; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 9px 18px; border-radius: 999px; transition: all .2s; }
    .filters a:hover { border-color: var(--sage); color: var(--ink); }
    .filters a[aria-current="page"] { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }

    /* ---------- product grid ---------- */
    .shop { padding: 40px 0 90px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px; }
    .card { background: var(--paper); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform .3s ease, box-shadow .3s ease; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
    .card-media { position: relative; aspect-ratio: 4 / 4.4; background: var(--cream-deep); overflow: hidden; }
    .card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
    .card:hover .card-media img { transform: scale(1.05); }
    .card.is-sold .card-media img { filter: grayscale(.4); opacity: .8; }
    .chip { position: absolute; top: 14px; left: 14px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: rgba(255, 253, 249, .92); color: var(--sage-deep); padding: 6px 11px; border-radius: 999px; }
    .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-title { font-family: var(--serif); font-size: 20px; font-weight: 400; line-height: 1.25; }
    .card-desc { font-size: 14px; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line); }
    .seller { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
    .seller span.avatar { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--terracotta-wash); color: var(--terracotta-deep); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
    .seller span.name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--terracotta-deep); white-space: nowrap; }

    .empty { text-align: center; background: var(--paper); border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 60px 24px; }
    .empty svg { margin: 0 auto 18px; }
    .empty h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin-bottom: 8px; }
    .empty p { color: var(--ink-soft); max-width: 420px; margin: 0 auto 24px; }

    /* ---------- sell ---------- */
    .sell { background: var(--sage-wash); padding: 90px 0; }
    .sell .wrap { display: grid; grid-template-columns: .85fr 1.15fr; gap: 56px; align-items: start; }
    .sell-intro p { color: var(--ink-soft); margin: 16px 0 30px; max-width: 400px; }
    .steps { list-style: none; display: grid; gap: 18px; counter-reset: step; }
    .steps li { display: flex; gap: 14px; align-items: flex-start; font-size: 15px; }
    .steps li::before { counter-increment: step; content: counter(step); flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); color: var(--terracotta-deep); font-family: var(--serif); font-weight: 600; display: grid; place-items: center; box-shadow: var(--shadow); }
    .steps b { display: block; }
    .steps span { color: var(--ink-soft); font-size: 14px; }

    .panel { background: var(--paper); border-radius: 24px; padding: 34px; box-shadow: var(--shadow-lift); }
    .errors { background: #fbeae5; border: 1px solid #efc9bd; color: var(--danger); border-radius: 12px; padding: 14px 18px; margin-bottom: 22px; font-size: 14px; }
    .errors ul { padding-left: 18px; }
    .field { margin-bottom: 18px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
    label .opt { font-weight: 400; color: var(--ink-soft); }
    input[type="text"], input[type="number"], select, textarea { width: 100%; font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--cream); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .2s, background .2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sage); background: var(--paper); }
    textarea { resize: vertical; min-height: 96px; }
    .price-input { position: relative; }
    .price-input span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
    .price-input input { padding-left: 30px; }
    .drop { position: relative; display: flex; align-items: center; gap: 16px; border: 1.5px dashed var(--sage); background: var(--cream); border-radius: 14px; padding: 16px; cursor: pointer; transition: background .2s, border-color .2s; }
    .drop:hover, .drop:focus-within { background: var(--sage-wash); border-color: var(--sage-deep); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px; background: var(--paper); display: grid; place-items: center; overflow: hidden; }
    .drop-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .drop-text { font-size: 14px; color: var(--ink-soft); }
    .drop-text b { display: block; color: var(--ink); font-weight: 600; }
    .panel .btn { width: 100%; margin-top: 8px; }
    .login-panel { text-align: center; }
    .login-panel h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 14px 0 8px; }
    .login-panel p { color: var(--ink-soft); margin-bottom: 24px; }
    .login-panel .cta-row { justify-content: center; }

    /* ---------- buying ---------- */
    .chip-status { left: auto; right: 14px; background: var(--ink); color: var(--paper); }
    .card-action { padding-top: 12px; }
    .card-note { display: block; text-align: center; font-size: 13px; color: var(--ink-soft); background: var(--cream-deep); border-radius: 999px; padding: 9px 12px; }
    .btn-sm { width: 100%; padding: 10px 18px; font-size: 14px; }
    .field-hint { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
    .free-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; margin: 10px 0 0; cursor: pointer; }
    .free-toggle input { accent-color: var(--sage-deep); width: 16px; height: 16px; margin: 0; }
    input[readonly] { color: var(--ink-soft); background: var(--cream-deep); }

    /* ---------- footer ---------- */
    footer { padding: 34px 0; font-size: 13px; color: var(--ink-soft); }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--ink); }

    /* ---------- responsive ---------- */
    @media (max-width: 900px) {
        .hero { padding: 44px 0 30px; }
        .hero .wrap, .sell .wrap { grid-template-columns: 1fr; gap: 40px; }
        .hero-art { max-width: 420px; width: 100%; margin: 0 auto; }
        .hero-badge { left: 0; }
        .sell { padding: 64px 0; }
    }
    @media (max-width: 900px) {
        .brand-tag, .nav-user, .nav-links .hide-sm { display: none; }
    }
    @media (max-width: 640px) {
        .wrap { padding: 0 16px; }
        .nav .wrap { height: 62px; }
        .brand-tag, .nav-user, .nav-links .hide-sm { display: none; }
        .nav-links a { padding: 8px 10px; }
        .field-row { grid-template-columns: 1fr; }
        .panel { padding: 24px 20px; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 20px; }
        .hero-notes { gap: 20px; }
    }
    @media (max-width: 400px) {
        .brand { gap: 8px; }
        .brand-mark { width: 30px; height: 30px; }
        .brand-name { font-size: 18px; }
        .nav-links { gap: 0; }
        .nav-links a { padding: 7px 8px; font-size: 13px; }
    }
    @media (max-width: 340px) {
        .brand-name { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        * { transition: none !important; }
    }
</style>
