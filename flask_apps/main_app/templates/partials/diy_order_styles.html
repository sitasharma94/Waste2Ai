<style>
    /* Checkout, My Orders and order pages (extends partials/diy_styles.html) */
    .page { padding: 44px 0 90px; }
    .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-soft); text-decoration: none; margin-bottom: 18px; }
    .back:hover { color: var(--ink); }
    .page-title { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4vw, 44px); line-height: 1.1; letter-spacing: -.015em; margin-bottom: 10px; }
    .page-sub { color: var(--ink-soft); margin-bottom: 30px; max-width: 620px; }

    .steps-bar { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin-bottom: 30px; }
    .steps-bar li { font-size: 13px; font-weight: 600; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; }
    .steps-bar li.on { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
    .steps-bar li.done { color: var(--sage-deep); border-color: #cdd6c3; background: var(--sage-wash); }

    .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr); gap: 32px; align-items: start; }
    .layout > *, .stack > *, .grid-2 > *, .field { min-width: 0; }
    .box, .summary-item h3, .address, dl.details dd, .lines li b, .page-title { overflow-wrap: anywhere; }
    .box input, .box select, .box textarea { max-width: 100%; min-width: 0; }
    .stack { display: grid; gap: 22px; }
    .box { background: var(--paper); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); }
    .box h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; margin-bottom: 18px; }
    .box h2 small { font-family: var(--sans); font-size: 13px; color: var(--ink-soft); margin-left: 6px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
    .span-2 { grid-column: 1 / -1; }
    input[type="tel"] { width: 100%; font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--cream); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .2s, background .2s; }
    .phone-input { position: relative; }
    .phone-input span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); font-size: 15px; }
    .phone-input input { padding-left: 50px; }

    fieldset { border: 0; }
    .pay-group { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin: 16px 0 8px; }
    .pay-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 215px), 1fr)); gap: 10px; }
    .pay { min-width: 0; line-height: 1.3; }
    .pay .tag { flex-shrink: 0; }
    .pay { position: relative; display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--cream); border-radius: 14px; padding: 13px 14px; cursor: pointer; font-size: 14px; font-weight: 600; transition: border-color .2s, background .2s; }
    .pay input { accent-color: var(--sage-deep); width: 17px; height: 17px; margin: 0; }
    .pay:has(input:checked) { border-color: var(--sage-deep); background: var(--sage-wash); }
    .pay.off { cursor: not-allowed; color: var(--ink-soft); background: var(--paper); border-style: dashed; }
    .pay .tag { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--terracotta-deep); background: var(--terracotta-wash); padding: 3px 8px; border-radius: 999px; }
    .info { display: flex; gap: 12px; align-items: flex-start; background: var(--cream-deep); border-radius: 14px; padding: 14px 16px; font-size: 13.5px; color: var(--ink-soft); margin-top: 16px; }
    .info.sage { background: var(--sage-wash); color: var(--sage-deep); }
    .info b { color: var(--ink); }

    .summary { position: sticky; top: 92px; }
    .summary-item { display: flex; gap: 14px; align-items: center; }
    .summary-item img { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; background: var(--cream-deep); flex-shrink: 0; }
    .summary-item h3 { font-family: var(--serif); font-weight: 400; font-size: 19px; line-height: 1.25; }
    .summary-item p { font-size: 13px; color: var(--ink-soft); }
    .lines { list-style: none; margin-top: 20px; border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 10px; font-size: 14px; }
    .lines li b { min-width: 0; }
    .lines li { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-soft); }
    .lines li b { color: var(--ink); font-weight: 500; text-align: right; }
    .lines li.total { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; font-size: 16px; color: var(--ink); font-weight: 600; }
    .lines li.total b { font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--terracotta-deep); }

    dl.details { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; font-size: 14.5px; }
    dl.details dt { color: var(--ink-soft); }
    dl.details dd { color: var(--ink); }
    .address { font-style: normal; line-height: 1.7; font-size: 14.5px; }
    .confirm-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 500; margin: 6px 0 4px; cursor: pointer; }
    .confirm-line input { accent-color: var(--sage-deep); width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .actions form { display: contents; }
    .btn-plain { background: var(--paper); color: var(--ink); border-color: var(--line); }
    .btn-plain:hover { border-color: var(--ink); }
    .btn-danger { background: transparent; color: var(--danger); border-color: #e7b9ad; }
    .btn-danger:hover { background: #fbeae5; }
    .btn-sage { background: var(--sage-deep); color: #fff; }
    .btn-sage:hover { background: #3f4b38; }

    .status { display: inline-block; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
    .st-placed { background: var(--terracotta-wash); color: var(--terracotta-deep); }
    .st-confirmed, .st-shipped { background: var(--sage-wash); color: var(--sage-deep); }
    .st-delivered { background: var(--sage-deep); color: #fff; }
    .st-rejected, .st-cancelled { background: var(--cream-deep); color: var(--ink-soft); }

    .timeline { display: grid; grid-template-columns: repeat(4, 1fr); list-style: none; margin: 6px 0 4px; }
    .timeline li { position: relative; text-align: center; font-size: 12.5px; color: var(--ink-soft); padding-top: 30px; }
    .timeline li::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); z-index: 1; }
    .timeline li::after { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--line); }
    .timeline li:first-child::after { display: none; }
    .timeline li.done { color: var(--ink); font-weight: 600; }
    .timeline li.done::before { background: var(--sage-deep); border-color: var(--sage-deep); }
    .timeline li.done::after { background: var(--sage-deep); }

    .timeline li small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 11px; margin-top: 2px; }
    .timeline li.current::before { box-shadow: 0 0 0 5px var(--sage-wash); }
    .st-pending_payment { background: #fdf3d8; color: #8a6414; }
    .people { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
    .people b { color: var(--ink); font-weight: 600; }
    .ship-form { margin-top: 22px; padding-top: 20px; border-top: 1px dashed var(--line); }
    .ship-form h3 { font-family: var(--serif); font-weight: 400; font-size: 19px; margin-bottom: 4px; }
    input[type="url"] { width: 100%; font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--cream); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }

    .pay-text { display: grid; gap: 2px; min-width: 0; }
    .pay-text small { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
    .pay-confirm { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; background: var(--paper); border: 1.5px solid #cfd8c4; border-radius: 22px; padding: 24px 26px; box-shadow: var(--shadow); margin-bottom: 26px; }
    .pay-confirm .tick { width: 46px; height: 46px; border-radius: 50%; background: var(--sage-deep); color: #fff; display: grid; place-items: center; font-size: 22px; }
    .pay-confirm h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; margin-bottom: 4px; }
    .pay-confirm dl.details { margin-top: 14px; }
    .sim-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6f5010; background: #fdf3d8; border: 1px dashed #d9b45a; padding: 3px 10px; border-radius: 999px; }
    .sim-banner { background: #fdf3d8; color: #6f5010; border: 1.5px dashed #d9b45a; border-radius: 14px; padding: 12px 16px; font-size: 14px; margin-bottom: 22px; }
    .pay.sim { border-style: dashed; border-color: #d9b45a; background: #fffaf0; }
    .pay.sim .tag { color: #6f5010; background: #fdf3d8; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .tabs a { text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; }
    .tabs a[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .tabs .badge { background: var(--terracotta); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .order-list { list-style: none; display: grid; gap: 14px; }
    .order-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 18px; align-items: center; background: var(--paper); border-radius: 18px; padding: 14px 18px 14px 14px; box-shadow: var(--shadow); text-decoration: none; transition: transform .2s, box-shadow .2s; }
    .order-row:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
    .order-row img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: var(--cream-deep); }
    .order-row h3 { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1.25; }
    .order-row .meta { font-size: 13px; color: var(--ink-soft); }
    .order-row .right { text-align: right; display: grid; gap: 6px; justify-items: end; }
    .order-row .amount { font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--terracotta-deep); }

    @media (max-width: 960px) {
        .layout { grid-template-columns: minmax(0, 1fr); }
        .summary { position: static; order: -1; }
    }
    @media (max-width: 640px) {
        .page { padding: 28px 0 60px; }
        .box { padding: 22px 18px; }
        .grid-2 { grid-template-columns: 1fr; }
        dl.details { grid-template-columns: 1fr; gap: 2px; }
        dl.details dd { margin-bottom: 10px; }
        .order-row { grid-template-columns: 56px 1fr; }
        .order-row img { width: 56px; height: 56px; }
        .order-row .right { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
        .actions .btn { flex: 1 1 100%; }
        .timeline li { font-size: 11px; }
    }
</style>
