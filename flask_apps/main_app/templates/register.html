<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Waste2Value</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #56ab2f, #a8e063);
    }

    .container {
        background: #ffffff;
        padding: 40px 35px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
    }

    .logo {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #2e7d32;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus, select:focus {
        border-color: #56ab2f;
    }

    button {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #56ab2f, #2e7d32);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: opacity 0.2s;
    }

    button:hover {
        opacity: 0.9;
    }

    .footer-text {
        text-align: center;
        margin-top: 18px;
        font-size: 13px;
        color: #666;
    }

    .footer-text a {
        color: #2e7d32;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<!-- Waste2Value UI-only theme overrides: visual styles only; existing HTML, routes and behavior remain unchanged. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style id="waste2value-ui-only-theme">
:root {
  --w2v-cream: #faf6ef;
  --w2v-paper: #fffdf9;
  --w2v-ink: #2f2a24;
  --w2v-muted: #6b6258;
  --w2v-line: #e8dfd1;
  --w2v-sage: #8a9a7b;
  --w2v-sage-deep: #4f5d46;
  --w2v-sage-wash: #e7ebe0;
  --w2v-terra: #c8775a;
  --w2v-terra-deep: #a95d42;
  --w2v-shadow: 0 8px 24px rgba(47,42,36,.07);
}
html { scroll-behavior: smooth; }
body {
  background: var(--w2v-cream) !important;
  color: var(--w2v-ink) !important;
  font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
}
h1, h2, h3, h4, .logo, .brand, .hero-title {
  font-family: 'Fraunces', Georgia, serif !important;
}
.navbar, header.navbar {
  background: var(--w2v-paper) !important;
  color: var(--w2v-ink) !important;
  border-bottom: 1px solid var(--w2v-line) !important;
  box-shadow: 0 3px 16px rgba(47,42,36,.04) !important;
}
.navbar .logo, .navbar .user-info, .navbar .logo a {
  color: var(--w2v-ink) !important;
}
.navbar a {
  border-radius: 999px !important;
  transition: background .2s ease, transform .2s ease !important;
}
.navbar a:hover { transform: translateY(-1px); }
.content, main, .container, .page-container {
  color: var(--w2v-ink);
}
.welcome-card, .card, .listing-card, .form-card, .stat-card, .panel,
.order-card, .profile-card, .idea-card, .pickup-card {
  background: var(--w2v-paper) !important;
  border: 1px solid var(--w2v-line) !important;
  border-radius: 20px !important;
  box-shadow: var(--w2v-shadow) !important;
}
.welcome-card h2, .section-title, .page-title, .welcome-title {
  color: var(--w2v-sage-deep) !important;
}
p, .muted, .subtitle, .description { color: var(--w2v-muted); }
button, input[type="submit"], .btn, a.btn, .button, .primary-btn {
  border-radius: 999px !important;
  font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease !important;
}
button:hover, input[type="submit"]:hover, .btn:hover, a.btn:hover,
.button:hover, .primary-btn:hover {
  transform: translateY(-1px);
}
.btn-primary, .primary-btn, button[type="submit"], input[type="submit"] {
  background: var(--w2v-sage-deep) !important;
  border-color: var(--w2v-sage-deep) !important;
  color: white !important;
}
.btn-primary:hover, .primary-btn:hover, button[type="submit"]:hover,
input[type="submit"]:hover { background: #3e4a37 !important; }
.btn-secondary, .secondary-btn {
  background: var(--w2v-sage-wash) !important;
  border-color: var(--w2v-line) !important;
  color: var(--w2v-sage-deep) !important;
}
input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]),
select, textarea {
  border: 1px solid #d9cebd !important;
  border-radius: 12px !important;
  background: var(--w2v-paper) !important;
  color: var(--w2v-ink) !important;
  font: inherit;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid rgba(138,154,123,.35) !important;
  border-color: var(--w2v-sage) !important;
}
table {
  border-collapse: separate !important;
  border-spacing: 0 !important;
  overflow: hidden;
  border-radius: 14px;
  background: var(--w2v-paper);
}
th { background: var(--w2v-sage-wash) !important; color: var(--w2v-sage-deep) !important; }
th, td { border-color: var(--w2v-line) !important; }
.alert, .flash, .message {
  border-radius: 12px !important;
}
a { transition: color .18s ease; }
a:hover { color: var(--w2v-terra-deep); }
@media (max-width: 700px) {
  .navbar { flex-wrap: wrap; gap: 12px; padding: 14px 18px !important; }
  .content, main { padding-left: 16px !important; padding-right: 16px !important; }
  .welcome-card, .card, .listing-card, .form-card, .stat-card, .panel {
    border-radius: 16px !important;
  }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
</style>

</head>
<body>

<div class="container">
    <div class="logo">♻️ Waste2Value</div>
    <div class="subtitle">Create your account to get started</div>

    {% if error %}
    <div style="background:#fdecea;color:#d32f2f;padding:10px;border-radius:8px;font-size:13px;margin-bottom:15px;text-align:center;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label>I want to join as</label>
            <select name="role">
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
            </select>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="footer-text">
        Already have an account? <a href="/login">Login</a>
    </div>
</div>

</body>
</html>
